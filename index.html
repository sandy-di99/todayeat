function cuteSound(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();

    // 可愛音樂盒旋律：叮—叮叮、啦啦啦，抽到餐廳時播放一次
    const notes=[
      [659.25,0.00,0.16],[783.99,0.16,0.16],[987.77,0.32,0.18],
      [783.99,0.52,0.14],[659.25,0.68,0.14],[783.99,0.84,0.18],
      [1046.50,1.04,0.25],[987.77,1.31,0.16],[783.99,1.49,0.16],
      [1046.50,1.68,0.34]
    ];

    notes.forEach(([freq,offset,dur])=>{
      const o=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      o.type="sine";
      o.frequency.setValueAtTime(freq,audioCtx.currentTime+offset);
      o.connect(g); g.connect(audioCtx.destination);
      const t=audioCtx.currentTime+offset;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.10,t+0.025);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.start(t); o.stop(t+dur+0.03);
    });
  }catch(e){}
}
function stars(v){if(!v)return "尚未補齊";let full=Math.floor(v), half=(v-full)>=.5?1:0;return "★".repeat(full)+"☆".repeat(5-full-half)+(half?" ½":"")}
function show(r){
 $("resultName").textContent=r.name;$("result").classList.add("ready");
 const verified=!!r.rating;
 $("info").innerHTML=`<h2>🍽️ ${r.name}</h2>
 <div>${r.meals.map(x=>`<span class="tag">${x}</span>`).join("")}</div>
 <div class="row"><span class="label">📍 地址</span>${r.address||"尚未補齊"}</div>
 <div class="row"><span class="label">🕐 營業時間</span>${r.hours}</div>
 <div class="row"><span class="label">⭐ 評價</span><span class="stars">${stars(r.rating)}</span>${r.rating?`　${r.rating} / 5`:""}</div>
 <div class="row"><span class="label">🍴 推薦餐點</span>${r.dishes.map((x,i)=>`${i+1}. ${x}`).join("　")}</div>
 ${verified?"":"<div class='notice'>這間店的部分公開資料目前尚未查到足夠資訊，先保留欄位，避免誤植。</div>"}`;
 $("info").classList.add("show");
}
function pick(){
 cuteSound();const pool=restaurants.filter(r=>r.meals.includes(meal));if(!pool.length)return;
 let r;do{r=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&r.name===restaurants[last]?.name);
 last=restaurants.indexOf(r);show(r);
}
$("pick").onclick=pick;
</script></body></html>
